name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ci-apk-25.12.5]

env:
  RELEASE: 25.12.5
  TARGET: ipq806x/generic

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Fetch and verify SDK
        run: |
          BASE=https://downloads.openwrt.org/releases/$RELEASE/targets/$TARGET
          FILE=$(curl -fsS "$BASE/" | grep -oE 'openwrt-sdk-[^"<>]+\.Linux-x86_64\.tar\.zst' | head -1)
          echo "SDK: $FILE"
          curl -fsSLO "$BASE/$FILE"
          curl -fsS "$BASE/sha256sums" | grep "$FILE" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$FILE" -C sdk --strip-components=1

      - name: Fetch base library package definitions (not shipped in the SDK)
        run: |
          git clone --depth 1 --branch v$RELEASE --filter=blob:none --sparse https://github.com/openwrt/openwrt.git /tmp/owrt
          git -C /tmp/owrt sparse-checkout set package/libs/libpcap package/libs/libjson-c package/libs/libubox package/libs/libnl-tiny package/system/ubus
          mkdir -p sdk/package/libs sdk/package/system
          cp -a /tmp/owrt/package/libs/libpcap /tmp/owrt/package/libs/libjson-c /tmp/owrt/package/libs/libubox /tmp/owrt/package/libs/libnl-tiny sdk/package/libs/
          cp -a /tmp/owrt/package/system/ubus sdk/package/system/
          grep -hE "^PKG_(VERSION|SOURCE_DATE|SOURCE_VERSION|ABI_VERSION)" sdk/package/libs/libubox/Makefile sdk/package/system/ubus/Makefile sdk/package/libs/libnl-tiny/Makefile || true

      - name: Build usteer
        run: |
          cd sdk
          cp feeds.conf.default feeds.conf
          echo "src-link usteer $GITHUB_WORKSPACE/openwrt" >> feeds.conf
          ./scripts/feeds update usteer
          ./scripts/feeds install -p usteer usteer
          make defconfig
          make package/libjson-c/compile package/libubox/compile package/libnl-tiny/compile package/ubus/compile package/libpcap/compile -j"$(nproc)" V=s
          ls staging_dir/target-*/usr/include/libubox/avl.h staging_dir/target-*/usr/include/pcap/pcap.h
          make package/usteer/compile -j"$(nproc)" V=s

      - name: Collect packages
        run: |
          mkdir out
          find sdk/bin -name 'usteer*.apk' -exec cp -v {} out/ \;
          ls -l out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: usteer-${{ env.RELEASE }}-ipq806x
          path: out/*.apk
